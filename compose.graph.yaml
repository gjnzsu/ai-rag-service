name: ai-rag-graph-poc
services:
  neo4j:
    image: neo4j:5.26.12
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${GRAPH_NEO4J_PASSWORD:?Set GRAPH_NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - graph-data:/data
volumes:
  graph-data:
